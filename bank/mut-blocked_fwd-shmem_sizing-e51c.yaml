prompt: "# Debugging task: `blocked_attention_fwd`\n\nThe `blocked_attention_fwd` implementation below is a triton routine that is believed to be\ncorrect. It is not. On at least one input it silently disagrees with an\nindependent reference implementation, and the disagreement is not visible on the\nshapes it was checked on.\n\n## Implementation under test\n\n```python\n\"\"\"Blocked attention forward: known-good baseline.\"\"\"\nfrom __future__ import annotations\nimport torch\n\ndef blocked_attention_fwd(q: torch.Tensor, k: torch.Tensor, v: torch.Tensor, n_ctx: int, k_start: int=0, block_n: int=64) -> torch.Tensor:\n    \"\"\"Attention forward over a window of a padded KV cache.\n\n    ``q`` is ``(B, H, M, D)``; ``k`` and ``v`` are ``(B, H, N_pad, D)``. Only\n    cache entries ``[k_start, k_start + n_ctx)`` carry data -- the rest is\n    eviction slack ahead of the window and allocation slack behind it, and\n    neither may influence the result.\n    \"\"\"\n    head_dim = int(q.shape[-1])\n    n_pad = int(k.shape[-2])\n    scale = float(head_dim) ** (-0.5)\n    lo = int(k_start)\n    hi = lo + int(n_ctx)\n    out = torch.empty(q.shape, dtype=q.dtype, device=q.device)\n    if int(n_ctx) <= 0:\n        out.zero_()\n        return out\n    lead = tuple(q.shape[:-1])\n    acc = torch.zeros(lead + (head_dim,), dtype=torch.float32, device=q.device)\n    m_run = torch.full(lead, float('-inf'), dtype=torch.float32, device=q.device)\n    l_run = torch.zeros(lead, dtype=torch.float32, device=q.device)\n    q_f32 = q.to(torch.float32)\n    n_blocks = (n_pad + int(block_n) - 1) // int(block_n)\n    for blk in range(n_blocks):\n        start = blk * int(block_n)\n        offs = start + torch.arange(int(block_n), device=q.device)\n        mask = (offs >= lo) & (offs < hi)\n        n_valid = int(mask.sum())\n        if n_valid == 0:\n            continue\n        gather = offs.clamp_max(n_pad - 1)\n        k_blk = k.index_select(-2, gather).to(torch.float32)\n        v_blk = v.index_select(-2, gather).to(torch.float32)\n        k_blk_t = k_blk.transpose(-1, -2).contiguous()\n        s = q_f32 @ k_blk_t * scale\n        s = torch.where(mask, s, torch.full_like(s, float('-inf')))\n        blk_max = s.amax(dim=-1)\n        m_prev = m_run.clone()\n        torch.maximum(m_run, blk_max, out=m_run)\n        alpha = torch.exp(m_prev - m_run)\n        lane = offs - start\n        prob = torch.zeros(32, dtype=torch.float32, device=q.device)\n        prob[..., lane] = torch.where(mask, torch.exp(s - m_run.unsqueeze(-1)), torch.zeros_like(s))\n        l_run.mul_(alpha)\n        l_run.add_(prob.sum(dim=-1))\n        acc.mul_(alpha.unsqueeze(-1))\n        acc.add_(prob @ v_blk)\n    denom = torch.where(l_run > 0, l_run, torch.ones_like(l_run))\n    out.copy_((acc / denom.unsqueeze(-1)).to(out.dtype))\n    return out\n```\n\n## Shapes it was checked on\n\nEach of these was executed and agreed with an independent reference to within the derived error budget, so none of them exposes the defect:\n\n- `zero_ctx_fp32`: batch=1, block_n=64, dtype='float32', head_dim=32, heads=1, k_start=0, n_ctx=0, n_pad=64, noncontig=False, q_len=4\n\n## What to produce\n\n1. **Root cause.** Which expression is wrong, and what it does wrong.\n2. **Trigger class.** What property an input must have for the defect to show,\n   and why every shape above lacks that property.\n3. **Fix.** A corrected `blocked_attention_fwd` with the same name and the same signature.\n\n## Rules\n\n- Pure PyTorch. Do not import or call: `torch.nn.functional.scaled_dot_product_attention`, `torch.scaled_dot_product_attention`, `torch._C._nn.scaled_dot_product_attention`, `torch.ops.aten.scaled_dot_product_attention`, `torch.ops.aten._scaled_dot_product_flash_attention`, `torch.nn.MultiheadAttention`, `torch.nn.functional.multi_head_attention_forward`, `torch.nn.functional.softmax`, `torch.softmax`, `torch.Tensor.softmax`, `torch.nn.Softmax`, `torch.logsumexp`, `torch.einsum`, `crucible.seeds.attention.attention_reference`, `crucible.seeds.attention.blocked_attention_fwd`.\n- Do not special-case shapes, memoise inputs, or return a precomputed answer.\n- Your submission is executed on withheld shapes chosen specifically to expose\n  this defect, with freshly seeded inputs. Reproducing the behaviour on the\n  shapes above is necessary and not sufficient.\n"
