prompt: "# Debugging task: `int4_dequant_matmul`\n\nThe `int4_dequant_matmul` implementation below is a cuda routine that is believed to be\ncorrect. It is not. On at least one input it silently disagrees with an\nindependent reference implementation, and the disagreement is not visible on the\nshapes it was checked on.\n\n## Implementation under test\n\n```python\n\"\"\"int4 dequant + matmul over a padded K axis: known-good baseline.\"\"\"\nfrom __future__ import annotations\nimport torch\n\ndef int4_dequant_matmul(a: torch.Tensor, b_packed: torch.Tensor, scales: torch.Tensor, zero_points: torch.Tensor, k_valid: int, group_size: int=32, block_m: int=32, block_k: int=64) -> torch.Tensor:\n    \"\"\"``a[:, :k_valid] @ dequant(b_packed)[:k_valid, :]``.\n\n    ``a`` is ``(M, K_pad)``; ``b_packed`` is ``(K_pad, N // 2)`` uint8 holding\n    output column ``2j`` in the low nibble and ``2j + 1`` in the high nibble;\n    ``scales`` is ``(n_groups, N)`` and ``zero_points`` is ``(n_groups,)``, with\n    group ``g`` covering K indices ``[g * group_size, (g + 1) * group_size)``.\n    \"\"\"\n    m_size = int(a.shape[0])\n    k_pad = int(a.shape[1])\n    n_half = int(b_packed.shape[1])\n    n_size = n_half * 2\n    k = int(k_valid)\n    bm, bk = (int(block_m), int(block_k))\n    n_groups = int(scales.shape[0])\n    out = torch.empty((m_size, n_size), dtype=a.dtype, device=a.device)\n    if k <= 0 or m_size == 0 or n_size == 0:\n        out.zero_()\n        return out\n    n_kblocks = (k_pad + bk - 1) // bk\n    for m0 in range(0, m_size, bm):\n        m_hi = min(m0 + bm, m_size)\n        acc = torch.zeros((m_hi - m0, n_size), dtype=torch.float16, device=a.device)\n        comp = torch.zeros((m_hi - m0, n_size), dtype=torch.float32, device=a.device)\n        for kb in range(n_kblocks):\n            k0 = kb * bk\n            offs_k = k0 + torch.arange(bk, device=a.device)\n            mask_k = offs_k < k\n            if int(mask_k.sum()) == 0:\n                continue\n            byte_view = b_packed[k0:k0 + bk, :]\n            width = int(byte_view.shape[0])\n            lane = torch.arange(width, device=a.device)\n            low = (byte_view & 15).to(torch.int16)\n            high = (byte_view >> 4 & 15).to(torch.int16)\n            q_buf = torch.zeros((bk, n_half, 2), dtype=torch.int16, device=a.device)\n            q_buf[lane, :, 0] = low\n            q_buf[lane, :, 1] = high\n            q_flat = q_buf.reshape(bk, n_size).to(torch.float32)\n            group = (offs_k // int(group_size)).clamp_max(n_groups - 1)\n            scale_tile = scales.index_select(0, group).to(torch.float32)\n            zero_tile = zero_points.index_select(0, group).to(torch.float32).unsqueeze(1).expand(bk, n_size)\n            lane_mask = mask_k.to(torch.float32)\n            w_buf = (q_flat - zero_tile) * scale_tile\n            w_buf.mul_(lane_mask.unsqueeze(1))\n            a_view = a[m0:m_hi, k0:k0 + bk]\n            a_buf = torch.zeros((m_hi - m0, bk), dtype=torch.float32, device=a.device)\n            a_buf[:, lane] = a_view.to(torch.float32).contiguous()\n            a_buf.mul_(lane_mask.unsqueeze(0))\n            part = a_buf @ w_buf\n            y = part - comp\n            acc_prev = acc.clone()\n            acc.add_(y)\n            comp = acc - acc_prev - y\n        out[m0:m_hi, :] = acc.to(out.dtype)\n    return out\n```\n\n## Shapes it was checked on\n\nEach of these was executed and agreed with an independent reference to within the derived error budget, so none of them exposes the defect:\n\n- `zero_k_fp32`: block_k=64, block_m=32, dtype='float32', group_size=32, k_pad=64, k_valid=0, m=8, n=8, noncontig=False\n- `k129_bf16`: block_k=64, block_m=32, dtype='bfloat16', group_size=32, k_pad=192, k_valid=129, m=8, n=8, noncontig=False\n- `k129_fp16`: block_k=64, block_m=32, dtype='float16', group_size=32, k_pad=192, k_valid=129, m=8, n=8, noncontig=False\n- `k1023_bf16`: block_k=64, block_m=32, dtype='bfloat16', group_size=32, k_pad=1024, k_valid