 traffic * NS_PER_BYTE + launches * NS_PER_TILE_LAUNCH + k_steps * NS_PER_K_STEP\n\ndef _autotune(key, configs):\n    \"\"\"Search the config space on the CLASS REPRESENTATIVE, not on the concrete\n    problem. That is what makes the cache sound: the answer depends on nothing\n    but the key, so caching it cannot change any result. Ties go to the first\n    config in the given order, so the search is deterministic.\"\"\"\n    best = None\n    best_cost = None\n    for cfg in configs:\n        bm, bn, bk = (int(cfg[0]), int(cfg[1]), int(cfg[2]))\n        c = _cost_ns(key[0], key[1], key[2], bm, bn, bk)\n        if best_cost is None or c < best_cost:\n            best_cost = c\n            best = (bm, bn, bk)\n    return best\n\ndef _blocked_matmul(a, b, cfg, acc_dtype):\n    \"\"\"Tiled matmul with an explicit accumulator dtype, an explicit empty-tile\n    guard and an explicit store.\"\"\"\n    bm, bn, bk = cfg\n    m = int(a.shape[0])\n    k = int(a.shape[1])\n    n = int(b.shape[1])\n    out = torch.zeros(m, n, dtype=acc_dtype, device=a.device)\n    for i0 in range(0, m, bm):\n        i1 = min(i0 + bm, m)\n        if i1 <= i0:\n            continue\n        for j0 in range(0, n, bn):\n            j1 = min(j0 + bn, n)\n            if j1 <= j0:\n                continue\n            acc = torch.zeros(i1 - i0, j1 - j0, dtype=acc_dtype, device=a.device)\n            for p0 in range(0, k, bk):\n                p1 = min(p0 + bk, k)\n                acc = acc + a[i0:i1, p0:p1].to(acc_dtype) @ b[p0:p1, j0:j1].to(acc_dtype)\n            out[i0:i1, j0:j1] = acc\n    return out\n\ndef autotuned_gemm(a_flat, b_flat, shapes, configs, accum_dtype='float64'):\n    \"\"\"Run a sequence of GEMMs, tuning each shape class once and reusing it.\"\"\"\n    acc = getattr(torch, accum_dtype)\n    cache = {}\n    misses = 0\n    ys = []\n    chosen = []\n    costs = []\n    a_off = 0\n    b_off = 0\n    for spec in shapes:\n        m, n, k = (int(spec[0]), int(spec[1]), int(spec[2]))\n        a = a_flat[a_off:a_off + m * k].reshape(m, k)\n        a_off += m * k\n        b = b_flat[b_off:b_off + k * n].reshape(k, n)\n        b_off += k * n\n        key = _cache_key(m, n, k)\n        cfg = cache.get(key)\n        if cfg is None:\n            misses += 1\n            cfg = _autotune(key, configs)\n            cache[key] = cfg\n        ys.append(_blocked_matmul(a, b, cfg, acc).reshape(-1))\n        chosen.append([cfg[0], cfg[1], cfg[2]])\n        costs.append(_cost_ns(m, n, k, cfg[0], cfg[1], cfg[2]))\n    if ys:\n        y = torch.cat(ys).to(torch.float64)\n    else:\n        y = torch.zeros(0, dtype=torch.float64, device=a_flat.device)\n    if chosen:\n        cfg_t = torch.tensor(chosen, dtype=torch.int64)\n    else:\n        cfg_t = torch.zeros((0, 3), dtype=torch.int64)\n    cost_t = torch.tensor(costs, dtype=torch.float64)\n    return {'y': y, 'configs_used': cfg_t, 'cost_ns': cost_t, 'total_cost_ns': cost_t.sum().to(torch.float64), 'cache_misses': torch.tensor(misses, dtype=torch.int64)}\n```\n\n## Shapes it was checked on\n\nEach of these was executed and agreed with an independent reference to within the derived error budget, so none of them exposes the defect:\n\n- `empty_sequence`: shapes=[]\n\n## What to produce\n\n1. **Root cause.** Which expression is wrong, and what it does wrong.\n2. **Trigger class.** What property an input must have for the defect to show,\n   and why every shape above lacks that property.\n3. **Fix.** A corrected `autotuned_gemm` with the same name and the same signature.\n\n## Rules\n\n- Pure PyTorch. Do not import or call: `torch.matmul`, `torch.mm`, `torch.bmm`, `torch.einsum`, `torch.addmm`, `torch.nn.functional.linear`, `functools.lru_cache`, `functools.cache`, `crucible.seeds.autotune`.\n- Do not special-case shapes, memoise inputs, or return a precomputed answer.\n- Your submission is executed on withheld shapes chosen specifically to expose\n  this defect, with freshly seeded inputs. Reproducing the behaviour