prompt: "# Debugging task: `tiled_matmul`\n\nThe `tiled_matmul` implementation below is a cuda routine that is believed to be\ncorrect. It is not. On at least one input it silently disagrees with an\nindependent reference implementation, and the disagreement is not visible on the\nshapes it was checked on.\n\n## Implementation under test\n\n```python\n\"\"\"Tiled matmul over a padded K axis: known-good baseline.\"\"\"\nfrom __future__ import annotations\nimport torch\n\ndef tiled_matmul(a: torch.Tensor, b: torch.Tensor, k_valid: int, block_m: int=32, block_n: int=32, block_k: int=64) -> torch.Tensor:\n    \"\"\"``a[:, :k_valid] @ b[:k_valid, :]`` computed tile by tile.\n\n    ``a`` is ``(M, K_pad)`` and ``b`` is ``(K_pad, N)``. Rows of ``b`` and\n    columns of ``a`` at or beyond ``k_valid`` are allocation slack and must not\n    reach the accumulator.\n    \"\"\"\n    m_size = int(a.shape[0])\n    k_pad = int(a.shape[1])\n    n_size = int(b.shape[1])\n    k = int(k_valid)\n    bm, bn, bk = (int(block_m), int(block_n), int(block_k))\n    out = torch.empty((m_size, n_size), dtype=a.dtype, device=a.device)\n    if k <= 0 or m_size == 0 or n_size == 0:\n        out.zero_()\n        return out\n    n_kblocks = (k_pad + bk - 1) // bk\n    for m0 in range(0, m_size, bm):\n        m_hi = min(m0 + bm, m_size)\n        for n0 in range(0, n_size, bn):\n            n_hi = min(n0 + bn, n_size)\n            acc = torch.zeros((m_hi - m0, n_hi - n0), dtype=torch.float32, device=a.device)\n            comp = torch.zeros((m_hi - m0, n_hi - n0), dtype=torch.float32, device=a.device)\n            for kb in range(n_kblocks):\n                k0 = kb * bk\n                offs_k = k0 + torch.arange(bk, device=a.device)\n                mask_k = offs_k < k\n                if int(mask_k.sum()) == 0:\n                    continue\n                a_view = a[m0:m_hi, k0:k0 + bk]\n                b_view = b[k0:k0 + bk, n0:n_hi]\n                width = int(a_view.shape[1])\n                lane = torch.arange(width, device=a.device)\n                lane_mask = mask_k.to(torch.float32)\n                a_buf = torch.zeros((m_hi - m0, bk), dtype=torch.float32, device=a.device)\n                b_buf = torch.zeros((bk, n_hi - n0), dtype=torch.float32, device=a.device)\n                a_buf[:, lane] = a_view.to(torch.float32).contiguous()\n                b_buf[lane, :] = b_view.to(torch.float32).contiguous()\n                a_buf.mul_(lane_mask.unsqueeze(0))\n                b_buf.mul_(lane_mask.unsqueeze(1))\n                part = a_buf @ b_buf\n                y = part - comp\n                acc_prev = acc\n                acc.add_(y)\n                comp = acc - acc_prev - y\n            out[m0:m_hi, n0:n_hi] = acc.to(out.dtype)\n    return out\n```\n\n## Shapes it was checked on\n\nEach of these was executed and agreed with an independent reference to within the derived error budget, so none of them exposes the defect:\n\n- `k1_fp32`: block_k=64, block_m=32, block_n=32, dtype='float32', k_pad=1, k_valid=1, m=1, n=1, noncontig=False\n- `zero_k_fp32`: block_k=64, block_m=32, block_n=32, dtype='float32', k_pad=64, k_valid=0, m=8, n=8, noncontig=False\n- `empty_block_fp32`: block_k=64, block_m=32, block_n=32, dtype='float32', k_pad=128, k_valid=1, m=8, n=8, noncontig=False\n\n## What to produce\n\n1. **Root cause.** Which expression is wrong, and what it does wrong.\n2. **Trigger class.** What property an input must have for the defect to show,\n   and why every shape above lacks that property.\n3. **Fix.** A corrected `tiled_matmul` with the same name and the same signature.\n\n## Rules\n\n- Pure PyTorch. Do not import or call: `torch.matmul`, `torch.mm`, `torch.bmm`, `torch.addmm`, `torch.addbmm`, `torch.baddbmm`, `torch.einsum`, `torch.tensordot`, `torch.inner`, `torch.Tensor.matmul`, `torch.Tensor.mm`, `torch.nn.functional.linear`, `torch.nn.Linear`, `torch.ops.aten.mm`, `torch.ops.aten.addmm`, `numpy.matmul`, `numpy.dot`, `crucible.seeds.matmul.matmul_reference`, `crucible.seeds.matmul.tiled_matmul`.\n- Do not special-case shapes, memoise inputs, or return a precomputed answer.\n- Your submission is executed on withheld shapes chosen specifically to expose\n  this defect, with freshly seeded inputs. Reproducing the behaviour on the\n  shapes above is necessary and not sufficient.\n"
