prompt: "# Debugging task: `blocked_layernorm_fwd`\n\nThe `blocked_layernorm_fwd` implementation below is a triton routine that is believed to be\ncorrect. It is not. On at least one input it silently disagrees with an\nindependent reference implementation, and the disagreement is not visible on the\nshapes it was checked on.\n\n## Implementation under test\n\n```python\n\"\"\"Blocked LayerNorm forward: known-good baseline.\"\"\"\nfrom __future__ import annotations\nimport torch\n\ndef blocked_layernorm_fwd(x: torch.Tensor, weight: torch.Tensor, bias: torch.Tensor, n_valid: int, block_n: int=64, eps: float=1e-05) -> torch.Tensor:\n    \"\"\"LayerNorm over ``x[:, :n_valid]``; the padded tail is written as zeros.\n\n    ``x`` is ``(rows, N_pad)`` and ``weight`` / ``bias`` are ``(N_pad,)``. Only\n    the first ``n_valid`` columns carry data; the rest is allocation slack.\n    \"\"\"\n    rows = int(x.shape[0])\n    n_pad = int(x.shape[-1])\n    width_limit = int(block_n)\n    n = int(n_valid)\n    out = torch.empty(x.shape, dtype=x.dtype, device=x.device)\n    if n <= 0:\n        out.zero_()\n        return out\n    sum_acc = torch.zeros(rows, dtype=torch.float32, device=x.device)\n    var_acc = torch.zeros(rows, dtype=torch.float32, device=x.device)\n    n_blocks = (n_pad + width_limit - 1) // width_limit\n    for blk in range(n_blocks):\n        start = blk * width_limit\n        view = x[:, start:start + width_limit]\n        width = int(view.shape[-1])\n        lane = torch.arange(width, device=x.device)\n        offs = start + lane\n        mask = offs < n\n        if int(mask.sum()) == 0:\n            continue\n        tile = torch.zeros((rows, width_limit), dtype=torch.float32, device=x.device)\n        tile[:, lane] = view.to(torch.float32) * mask.to(torch.float32)\n        sum_acc.add_(tile.sum(dim=-1))\n    mean = sum_acc / float(n)\n    for blk in range(n_blocks):\n        start = blk * width_limit\n        view = x[:, start:start + width_limit]\n        width = int(view.shape[-1])\n        lane = torch.arange(width, device=x.device)\n        offs = start + lane\n        mask = offs < n\n        if int(mask.sum()) == 0:\n            continue\n        centred = view.to(torch.float32).clone()\n        centred.sub_(mean.unsqueeze(-1))\n        centred.mul_(mask.to(torch.float32))\n        var_acc.add_((centred * centred).sum(dim=-1))\n    var = var_acc / float(n)\n    rstd = torch.rsqrt(var + float(eps))\n    for blk in range(n_blocks):\n        start = blk * width_limit\n        view = x[:, start:start + width_limit]\n        width = int(view.shape[-1])\n        lane = torch.arange(width, device=x.device)\n        offs_full = start + torch.arange(width_limit, device=x.device)\n        mask_full = (offs_full < n).to(torch.float32)\n        if int(mask_full.sum()) == 0:\n            out[:, start:start + width] = torch.zeros((rows, width), dtype=out.dtype, device=out.device)\n            continue\n        stage = torch.zeros((rows, width_limit), dtype=torch.float32, device=x.device)\n        stage[:, lane] = view.to(torch.float32)\n        w_tile = torch.zeros(width_limit, dtype=torch.float32, device=x.device)\n        b_tile = torch.zeros(width_limit, dtype=torch.float32, device=x.device)\n        w_tile[lane] = weight[start:start + width_limit].to(torch.float32)\n        b_tile[lane] = bias[start:start + width_limit].to(torch.float32)\n        mu = mean.unsqueeze(-1).expand(rows, width_limit)\n        norm = (stage - mu) * rstd.unsqueeze(-1)\n        norm = b_tile\n        norm = norm * mask_full\n        out[:, start:start + width] = norm[:, :width].to(out.dtype)\n    return out\n```\n\n## Shapes it was checked on\n\nEach of these was executed and agreed with an independent reference to within the derived error budget, so none of them exposes the defect:\n\n- `zero_len_fp32`: block_n=64, dtype='float32', eps=1e-05, n_pad=64, n_valid=0, noncontig=False, rows=3\n\n## What to produce\n\n1. **Root cause.** Which expression is wrong, and what it does wrong.\n2. **Trigger class.** What property an input must have for the defect to show,\n   and why every shape above lacks that property.\n3. **Fix.** A corrected `blocked_layernorm_fwd` with the same name and the same signature.\n\n## Rules\n\n- Pure PyTorch. Do not import or call: `torch.nn.functional.layer_norm`, `torch.layer_norm`, `torch.native_layer_norm`, `torch.ops.aten.native_layer_norm`, `torch.ops.aten.layer_norm`, `torch.nn.LayerNorm`, `torch.nn.functional.group_norm`, `torch.nn.functional.rms_norm`, `torch.nn.functional.normalize`, `torch.nn.functional.batch_norm`, `torch.var_mean`, `torch.std_mean`, `torch.Tensor.var`, `torch.Tensor.std`, `torch.einsum`, `crucible.seeds.reduction.layernorm_reference`, `crucible.seeds.reduction.blocked_layernorm_fwd`.\n- Do not special-case shapes, memoise inputs, or return a precomputed answer.\n- Your submission is executed on withheld shapes chosen specifically to expose\n  this defect, with freshly seeded inputs. Reproducing the behaviour on the\n  shapes above is necessary and not sufficient.\n"
