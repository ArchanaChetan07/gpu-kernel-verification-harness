prompt: "# Debugging task: `train_step`\n\nThe `train_step` implementation below is a distributed routine that is believed to be\ncorrect. It is not. On at least one input it silently disagrees with an\nindependent reference implementation, and the disagreement is not visible on the\nshapes it was checked on.\n\n## Implementation under test\n\n```python\n\"\"\"Single-process simulation of one data-parallel + FSDP training step.\"\"\"\nimport torch\n\ndef _all_reduce_sum(parts, world_size):\n    \"\"\"SUM all-reduce over ``world_size`` ranks.\n\n    Every rank must contribute exactly once. A rank that skips the collective\n    deadlocks a real process group, so a participant count that does not match\n    the world size is raised here rather than summed over whoever showed up.\n    \"\"\"\n    if len(parts) != world_size:\n        raise RuntimeError('all-reduce desync: %d participants for world_size %d' % (len(parts), world_size))\n    total = parts[0].clone()\n    for p in parts[1:]:\n        total = total + p\n    return total\n\ndef _split_shards(x, y, shard_sizes):\n    \"\"\"Contiguous data-parallel split. A shard may legitimately be empty.\"\"\"\n    shards = []\n    off = 0\n    for n in shard_sizes:\n        n = int(n)\n        shards.append((x[off:off + n], y[off:off + n]))\n        off += n\n    return shards\n\ndef _shard_flat(flat, n_shards):\n    \"\"\"Contiguous parameter shards, FSDP style. The tail shard may be short and\n    a shard may be empty when there are more ranks than elements.\"\"\"\n    numel = int(flat.shape[0])\n    per = (numel + n_shards - 1) // n_shards\n    out = []\n    for r in range(n_shards):\n        lo = min(r * per, numel)\n        hi = min(lo + per, numel)\n        out.append(flat[lo:hi])\n    return out\n\ndef _local_grad_and_loss(xs, ys, w):\n    \"\"\"Cross-entropy gradient and loss SUM for one shard, computed by hand.\"\"\"\n    logits = xs @ w\n    shifted = logits - logits.max(dim=1, keepdim=True).values\n    exp = torch.exp(shifted)\n    probs = exp / exp.sum(dim=1, keepdim=True)\n    picked = probs.gather(1, ys.view(-1, 1)).clamp_min(1e-30)\n    loss_sum = -torch.log(picked).sum()\n    onehot = torch.zeros_like(probs)\n    onehot.scatter_(1, ys.view(-1, 1), 1.0)\n    grad_sum = xs.transpose(0, 1) @ (probs - onehot)\n    return (grad_sum, loss_sum)\n\ndef train_step(x, y, w0, shard_sizes, steps=8, lr=0.5, max_grad_norm=0.05, n_param_shards=2, accum_dtype='float32'):\n    \"\"\"Run ``steps`` DDP steps over a simulated ``len(shard_sizes)``-rank group.\"\"\"\n    acc = getattr(torch, accum_dtype)\n    world_size = len(shard_sizes)\n    total_n = 0\n    for n in shard_sizes:\n        total_n += int(n)\n    if total_n <= 0:\n        raise ValueError('global batch is empty; every shard has zero samples')\n    xf = x.to(acc)\n    w = w0.to(acc).clone()\n    losses = []\n    norms = []\n    for _ in range(steps):\n        grad_parts = []\n        loss_parts = []\n        for xs, ys in _split_shards(xf, y, shard_sizes):\n            if int(xs.shape[0]) == 0:\n                g = torch.zeros_like(w)\n                l = torch.zeros((), dtype=acc)\n            else:\n                g, l = _local_grad_and_loss(xs, ys, w)\n                grad_parts.append(g)\n            loss_parts.append(l)\n        grad = _all_reduce_sum(grad_parts, world_size) / total_n\n        loss = _all_reduce_sum(loss_parts, world_size) / total_n\n        param_shards = _shard_flat(grad.reshape(-1), n_param_shards)\n        local_sq = []\n        for s in param_shards:\n            local_sq.append((s * s).sum())\n        total_sq = _all_reduce_sum(local_sq, n_param_shards)\n        global_norm = torch.sqrt(total_sq)\n        if global_norm > max_grad_norm:\n            grad = grad * (max_grad_norm / (global_norm + 1e-06))\n        w = w - lr * grad\n        losses.append(loss)\n        norms.append(global_norm)\n    return {'losses': torch.stack(losses).to(torch.float32), 'grad_norms': torch.stack(norms).to(torch.float32), 'w': w.to(torch.float32)}\n```\n\n## Shapes it was checked on\n\nEach of these was executed and agreed with an independent reference to within the derived error budget, so none of them exposes the defect:\n\n- `fsdp_more_ranks_than_params`: d=2, k=2, n_param_shards=9, shard_sizes=[8, 8], steps=6\n- `dp1_single_decoy`: d=8, k=4, n_param_shards=1, shard_sizes=[24], steps=6\n- `dp2_noclip_normonly`: d=8, k=4, max_grad_norm=1000.0, n_param_shards=2, shard_sizes=[12, 12], steps=6\n- `fsdp5_ragged_params`: d=7, k=3, n_param_shards=5, shard_sizes=[10, 6, 6], steps=8\n- `dp2_even_clip`: d=8, k=4, n_param_shards=2, shard_sizes=[16, 16], steps=8\n- `dp3_uneven`: d=8, k=4, n_param_shards=2, shard_sizes=[21, 7, 4], steps=8\n\n## What to produce\n\n1. **Root cause.** Which expression is wrong, and what it does wrong.\n2. **Trigger class.** What property an input must have for the defect to show,\n   and why every shape above lacks that property.\n3. **Fix.** A corrected `train_step` with the same name and the same signature.\n\n## Rules\n\n- Pure PyTorch. Do not import or call: `torch.nn.utils.clip_grad_norm_`, `torch.nn.utils.clip_grad_value_`, `torch.autograd.grad`, `torch.autograd.backward`, `torch.nn.functional.cross_entropy`, `torch.nn.functional.nll_loss`, `torch.nn.functional.log_softmax`, `torch.nn.CrossEntropyLoss`, `torch.optim`, `crucible.seeds.collectives`.\n- Do not special-case shapes, memoise inputs, or return a precomputed answer.\n- Your submission is executed on withheld shapes chosen specifically to expose\n  this defect, with freshly seeded inputs. Reproducing the behaviour on the\n  shapes above is necessary and not sufficient.\n"
