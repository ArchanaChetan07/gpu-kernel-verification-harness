name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (cpu-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install torch (CPU wheel)
        # The CPU index keeps the runner download to a few hundred MB instead of
        # pulling a CUDA build that could never be exercised here anyway.
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Capability report
        # Genuinely not a gate: it records what this runner can honestly
        # verify, so a green tick is never mistaken for "every oracle ran". A
        # GPU-less runner legitimately skips O2 and O4's lowering checks, and
        # the log says so in as many words. continue-on-error makes the
        # comment true -- doctor exits 0 here today, but its contract is to
        # exit non-zero when the machine is capability-blocked, and that must
        # not be reported as a broken build.
        continue-on-error: true
        run: crucible doctor

      - name: Tests
        env:
          # Deterministic cuBLAS reductions if a CUDA build is ever used here.
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        run: python -m pytest tests/ -q --durations=10

      - name: Manufacture and verify a task end to end
        # A unit-test pass does not prove the foundry works. This drives the
        # real CLI: mutate a known-good seed, then execute the reference
        # solution through the oracles. It fails loudly if the pipeline breaks.
        run: |
          crucible mutate --seed reduction.blocked_layernorm \
            --classes boundary_mask --limit 1 --out ci_bank/
          crucible verify-bank ci_bank/ -o ci_verdicts/
          crucible coverage ci_bank/
